<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI预测报告 · OCTOPI AI 管理后台</title>
<style>
  :root {
    --primary: #2f54eb;
    --primary-soft: #eef2ff;
    --ink: #1f2329;
    --muted: #8a8f99;
    --line: #e5e7eb;
    --bg: #f2f3f5;
    --top: #1f2a44;
    --ok: #16a34a; --ok-bg: #e8f7ee;
    --bad: #dc2626; --bad-bg: #fdecec;
    --warn: #c2410c; --warn-bg: #fff3e6;
    --gray: #6b7280; --gray-bg: #f1f2f4;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px; color: var(--ink); background: var(--bg);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }

  .top {
    height: 48px; background: var(--top); color: #fff;
    display: flex; align-items: center; gap: 28px; padding: 0 18px;
  }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: .02em; width: 170px; }
  .top nav { display: flex; height: 100%; }
  .top nav span { display: flex; align-items: center; padding: 0 18px; color: #c9d1e3; }
  .top nav span.on { background: #fff; color: var(--ink); }
  .top .user { margin-left: auto; color: #c9d1e3; }

  .shell { display: flex; height: calc(100vh - 48px); }
  .side { width: 188px; background: #fff; border-right: 1px solid var(--line); overflow: auto; padding: 6px 0; flex-shrink: 0; }
  .side div { padding: 11px 20px; color: #4b5563; }
  .side .sub { padding-left: 40px; }
  .side .nav { cursor: pointer; }
  .side .nav:hover { color: var(--primary); }
  .side .on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .side .grp { color: var(--ink); font-weight: 500; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabs { background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 2px; padding: 6px 12px 0; }
  .tabs span { padding: 6px 14px; border-radius: 4px 4px 0 0; color: #4b5563; }
  .tabs span.nav { cursor: pointer; }
  .tabs span.on { background: var(--primary-soft); color: var(--primary); }
  .page { flex: 1; overflow: auto; padding: 12px; }
  .card { background: #fff; border-radius: 6px; padding: 16px; }

  .filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  .f { display: flex; align-items: center; gap: 8px; }
  .f > label { color: #4b5563; white-space: nowrap; }
  .ctl {
    height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff;
    padding: 0 10px; min-width: 150px;
  }
  .ctl:focus { outline: none; border-color: var(--primary); }
  input.ctl.q { width: 260px; }
  input[type="date"].ctl { min-width: 140px; }
  .range { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .range span { color: var(--muted); }
  .quick { display: flex; gap: 0; margin-left: 4px; flex-shrink: 0; }
  .quick button {
    height: 32px; padding: 0 12px; border: 1px solid #dcdfe6; background: #fff; margin-left: -1px; white-space: nowrap;
  }
  .quick button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .quick button:last-child { border-radius: 0 4px 4px 0; }
  .quick button:hover { color: var(--primary); }
  .quick button.on { background: var(--primary); border-color: var(--primary); color: #fff; position: relative; z-index: 1; }

  .bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 16px 0 12px; flex-wrap: wrap; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { background: #f2f3f5; border-radius: 6px; padding: 10px 14px; min-width: 170px; }
  .stat .k { font-size: 12px; color: #4b5563; }
  .stat .v { font-size: 20px; margin-top: 8px; text-align: center; }
  .stat .split { margin-top: 8px; padding-top: 6px; border-top: 1px dashed #d6d9de; font-size: 12px; color: #4b5563; }
  .stat .split-row { display: flex; justify-content: space-between; gap: 12px; line-height: 20px; font-variant-numeric: tabular-nums; }
  .stat .split-row em { font-style: normal; color: var(--muted); margin-left: 6px; display: inline-block; min-width: 32px; text-align: right; }
  .btns { display: flex; gap: 8px; align-items: center; }
  .btn {
    height: 32px; padding: 0 14px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff;
  }
  .btn:hover:not(:disabled) { color: var(--primary); border-color: #b9c6fb; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.link { border: 0; background: transparent; color: var(--primary); padding: 0 6px; height: auto; }

  .stabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 0; }
  .stabs button {
    border: 0; background: transparent; padding: 8px 14px; color: #4b5563; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .stabs button.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .stabs em { font-style: normal; color: var(--muted); margin-left: 4px; font-weight: 400; }
  .stabs button.on em { color: var(--primary); }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-top: 0; }
  .tbl-wrap.boxed { border-top: 1px solid var(--line); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 2020px; }
  table.prompts { min-width: 1400px; }
  th, td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; background: #fff; }
  th { background: #f7f8fa; color: #4b5563; font-weight: 600; font-size: 12px; }
  tr:hover td { background: #f8faff; }
  td.op, th.op { position: sticky; right: 0; box-shadow: -6px 0 8px -6px rgba(0,0,0,.12); z-index: 1; }
  th.op { background: #f7f8fa; }
  td.l { text-align: left; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  td.content-cell { text-align: left; max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: #4b5563; }
  td.mono, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; line-height: 20px; }
  .tag.ok { color: var(--ok); background: var(--ok-bg); }
  .tag.bad { color: var(--bad); background: var(--bad-bg); }
  .tag.warn { color: var(--warn); background: var(--warn-bg); }
  .tag.gray { color: var(--gray); background: var(--gray-bg); }
  .tag.blue { color: var(--primary); background: var(--primary-soft); }
  .tag.test { color: #7c3aed; background: #f3e8ff; margin-left: 4px; padding: 0 5px; }
  .conf { display: inline-flex; flex-direction: column; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
  .conf b { font-weight: 700; color: var(--ink); }
  .conf span { color: var(--muted); }
  .cbar { display: flex; width: 120px; height: 4px; border-radius: 2px; overflow: hidden; background: #eee; }
  .cbar i:nth-child(1) { background: #2f54eb; }
  .cbar i:nth-child(2) { background: #a3a9b6; }
  .cbar i:nth-child(3) { background: #f97316; }
  .ops { display: flex; gap: 2px; justify-content: center; }
  .ops .btn.link.danger { color: var(--bad); }
  .empty { padding: 48px; text-align: center; color: var(--muted); }
  .dot-run { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 5px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 14px; color: #4b5563; }
  .pager .ctl { min-width: 0; width: 90px; }
  .pager .pg { min-width: 30px; height: 30px; border: 0; border-radius: 4px; background: #f2f3f5; }
  .pager .pg.on { background: var(--primary); color: #fff; }
  .pager input.ctl { width: 50px; text-align: center; padding: 0 4px; }

  .chains { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; margin: 16px 0; }
  .chain { background: #f7f8fa; border-radius: 6px; padding: 12px 14px; }
  .chain h4 { margin: 0 0 4px; font-size: 13px; }
  .chain .desc { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .chain-row { display: grid; grid-template-columns: 22px 1fr 70px 130px 48px; gap: 8px; align-items: center; padding: 4px 0; font-size: 12px; }
  .chain-row .no { width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 11px; }
  .chain-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--primary); }
  .chain-row .pv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .chain .warnline { color: var(--warn); font-size: 12px; margin-top: 6px; }

  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 20; display: none; }
  #overlay.open { display: block; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: #fff; z-index: 21;
    display: none; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.12);
  }
  #drawer.open { display: flex; }
  .dh { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; }
  .dh h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .dh p { margin: 6px 0 0; color: var(--muted); }
  .x { border: 0; background: transparent; font-size: 20px; color: var(--muted); }
  .db { flex: 1; overflow: auto; padding: 16px 20px; }
  .df { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
  .kv { display: grid; grid-template-columns: 96px 1fr 96px 1fr; gap: 10px 12px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .sec { margin: 20px 0 8px; font-weight: 600; }
  .confbig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .confbig div { border: 1px solid var(--line); border-radius: 6px; padding: 10px; text-align: center; }
  .confbig div.pick { border-color: var(--primary); background: var(--primary-soft); }
  .confbig b { display: block; font-size: 22px; margin-top: 4px; }
  .content { background: #f7f8fa; border-radius: 6px; padding: 12px; line-height: 1.7; white-space: pre-wrap; }
  .think { background: #111827; color: #d1d5db; border-radius: 6px; padding: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.8; max-height: 260px; overflow: auto; }
  .think .t { color: #6b7280; margin-right: 8px; }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 10px 12px; margin-top: 12px; line-height: 1.6; }
  .note.blue { background: var(--primary-soft); color: #1d39c4; }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { padding: 0 0 12px 14px; border-left: 2px solid var(--line); position: relative; }
  .log li::before { content: ""; position: absolute; left: -5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  .log .at { color: var(--muted); font-size: 12px; }

  #modal { position: fixed; inset: 0; z-index: 30; display: none; overflow: auto; }
  #modal.open { display: block; }
  .mbg { position: fixed; inset: 0; background: rgba(0,0,0,.35); }
  .mcard { position: relative; width: min(560px, calc(100% - 32px)); margin: 10vh auto; background: #fff; border-radius: 8px; padding: 20px 22px; }
  .mcard.wide { width: min(780px, calc(100% - 32px)); margin-top: 5vh; }
  .mcard h3 { margin: 0 0 10px; font-size: 16px; }
  .mcard textarea { width: 100%; min-height: 70px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 8px; resize: vertical; }
  .mfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .frow { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: start; margin-bottom: 12px; }
  .frow > label { color: #4b5563; padding-top: 6px; }
  .frow .ctl { width: 100%; }
  .frow textarea.big { min-height: 180px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.6; }
  .frow .help { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; margin-top: 6px; }
  .hint.bad { color: var(--bad); }
  .hint.ok { color: var(--ok); }
  .rules { width: 100%; border-collapse: collapse; min-width: 0; }
  .rules th, .rules td { text-align: left; white-space: normal; padding: 8px; vertical-align: top; }

  #toast {
    position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 40;
    background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.12);
    padding: 10px 16px; border-radius: 6px; display: none; max-width: 80vw;
  }
  #toast.open { display: block; }
</style>
</head>

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const MIN = 60000, HOUR = 3600000, DAY = 86400000;

/* ---------- 提示词选择：按优先排序依次掷随机数，低于比率则执行；末位必定执行 ---------- */
function enabledChain(module, list) {
  return (list || db.prompts).filter((p) => p.module === module && p.enabled)

function seed() {
  const r = rng(20261120);

    const actor = i % 2 ? "陈岚" : OPERATOR;
    const created = NOW.getTime() - (40 - i * 3) * DAY;
    const versions = [{ v: 1, name: p.name, content: p.prev || p.content, at: created, operator: actor }];
    const log = [{ at: created, actor, text: `新增提示词（V1），${p.enabled ? "启用" : "停用"}。` }];
    if (p.prev) {
      const at = NOW.getTime() - 14 * DAY;
      versions.push({ v: 2, name: p.name, content: p.content, at, operator: OPERATOR });
      log.unshift({ at, actor: OPERATOR, text: "编辑：内容，版本升级为 V2。" });
    }
    const last = versions[versions.length - 1];
    const out = Object.assign({}, p, { version: last.v, versions, operator: last.operator, updatedAt: last.at, lastTest: null, log });
    delete out.prev;
    return out;

  const matchId = () => Array.from({ length: 15 }, () => "abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(r() * 36)]).join("");
  const matches = [];
  const total = 52;
  for (let i = 0; i < total; i++) {
    const f = FIXTURES[i % FIXTURES.length];
    let kickoff = NOW.getTime() + (-50 + i) * DAY + between(-6, 6) * HOUR;
    if (i === total - 6) kickoff = NOW.getTime() - 35 * MIN;
    if (i === total - 5) kickoff = NOW.getTime() - 80 * MIN;
    if (i === total - 4) kickoff = NOW.getTime() + 3 * HOUR;
    kickoff = Math.round(kickoff / (5 * MIN)) * 5 * MIN;
    const goals = [];
    const hg = pick([0, 0, 1, 1, 1, 2, 2, 3]);
    const ag = pick([0, 0, 1, 1, 2, 2, 3]);
    for (let g = 0; g < hg; g++) goals.push({ side: "h", minute: between(3, 90) });
    for (let g = 0; g < ag; g++) goals.push({ side: "a", minute: between(3, 90) });
    goals.sort((a, b) => a.minute - b.minute);
    matches.push({ id: matchId(), sport: "football", home: f[0], away: f[1], league: f[2], leagueId: f[3], kickoff, goals });
  }
  for (let i = 0; i < 16; i++) {
    const f = BB_FIXTURES[i % BB_FIXTURES.length];
    let kickoff = NOW.getTime() + (-12 + i) * DAY + between(-5, 5) * HOUR;
    kickoff = Math.round(kickoff / (5 * MIN)) * 5 * MIN;
    let h = between(92, 124), a = between(92, 124);
    if (h === a) h += 3;
    matches.push({ id: matchId(), sport: "basketball", home: f[0], away: f[1], league: f[2], leagueId: f[3], kickoff, final: { h, a } });
  }

  const reports = [];
  matches.forEach((m, i) => {
    const preCount = 1 + (r() < 0.4 ? 1 : 0) + (r() < 0.12 ? 1 : 0);
    const times = Array.from({ length: preCount }, () => m.kickoff - between(2, 36) * HOUR - between(0, 59) * MIN).sort((a, b) => a - b);
    times.forEach((t, k) => {
      const forcePending = m.sport === "football" && m.kickoff > NOW.getTime() && k === times.length - 1 && i % 2 === 0;
      reports.push(makeReport(r, m, "pre", t, { forcePending }));
    });
    const wall = (NOW.getTime() - m.kickoff) / MIN;
    if (m.sport === "football" && wall > 25 && r() < 0.35) {
      reports.push(makeReport(r, m, "live", m.kickoff + between(20, Math.min(80, wall - 2)) * MIN, {}));
    }

  reports.forEach((rep) => {
    if (rep.source !== "local") return;
    const p = choosePrompt(MATCH_SPORT(matches, rep.matchId), r, prompts);
    const v = p.versions.filter((x) => x.at <= rep.generatedAt).pop() || p.versions[0];
    rep.promptId = p.id; rep.promptVersion = v.v;
  });
  const list = reports.filter((x) => x.generatedAt <= NOW.getTime()).sort((a, b) => a.generatedAt - b.generatedAt);
  list.forEach((x, i) => { x.id = String(331000 + i); });
  const otherMatch = matches.find((m) => m.sport === "basketball" && m.kickoff > NOW.getTime());
  const testRuns = [{ id: "run-seed", operator: "陈岚", promptId: "PR005", matchId: otherMatch.id, module: "basketball",
    model: MODELS.local[0], startedAt: NOW.getTime(), duration: 25000 }];
  return { matches, reports: list, prompts, testRuns };
}
const MATCH_SPORT = (matches, id) => matches.find((m) => m.id === id).sport;

function makeReport(r, m, type, generatedAt, opts) {
  const o = opts || {};
  const source = o.source || (o.forcePending || r() < 0.3 ? "local" : "online");
  const model = o.model || MODELS[source][Math.floor(r() * 2)];
  const tokens = source === "online" ? 1800 + Math.floor(r() * 4200) : 9000 + Math.floor(r() * 22000);
  let conf;
  if (m.sport === "basketball") {
    let p = 28 + Math.floor(r() * 48);
    if (p === 50) p = 54;
    conf = [p, 0, 100 - p];
  } else {
    let w;
    do { w = [r() + 0.25, r() * 0.7 + 0.15, r() + 0.2]; } while (Math.abs(Math.max(...w) - [...w].sort((a, b) => b - a)[1]) < 0.04);
    const sum = w[0] + w[1] + w[2];
    conf = w.map((v) => Math.round((v / sum) * 100));
    conf[1] = 100 - conf[0] - conf[2];
  }
  const pick = ["1", "X", "2"][conf.indexOf(Math.max(...conf))];
  const recent = NOW.getTime() - generatedAt < 3 * DAY;
  const review = o.test ? "pending" : source === "local" && (o.forcePending || (recent && r() < 0.6)) ? "pending" : "approved";
  const blocked = !o.test && !o.forcePending && r() < 0.06;
  const log = [{
    at: generatedAt, actor: "系统",
    text: source === "online" ? `线上AI引擎生成（${model}），直接进入展示。` : `本地AI生成（${model}），进入待审核。`,
  }];
  if (source === "local" && review === "approved") log.unshift({ at: generatedAt + 40 * MIN, actor: "陈岚", text: "审核通过。" });
  if (blocked) log.unshift({ at: generatedAt + 3 * HOUR, actor: "陈岚", text: "屏蔽。原因：分析引用的伤停信息有误。" });
  const cost = source === "online" ? Math.round(tokens / 1000 * MODEL_PRICE[model] * 10000) / 10000 : null;

    promptId: o.promptId || null, promptVersion: o.promptVersion || null, test: !!o.test };
}

/* 比赛进程：未开赛 / 进行中 / 已结束 */
function matchState(m) {
  const wall = (Date.now() - m.kickoff) / MIN;
  if (wall < 0) return { phase: "upcoming" };
  if (m.sport === "basketball") {
    const done = wall >= 150;
    const k = done ? 1 : wall / 150;
    const h = Math.round(m.final.h * k), a = Math.round(m.final.a * k);
    return { phase: done ? "finished" : "live", h, a, outcome: h > a ? "1" : "2" };
  }
  const minute = wall <= 45 ? wall : wall <= 60 ? 45 : Math.min(90, wall - 15);
  const done = wall >= 110;
  const upTo = done ? 90 : minute;
  const h = m.goals.filter((g) => g.side === "h" && g.minute <= upTo).length;
  const a = m.goals.filter((g) => g.side === "a" && g.minute <= upTo).length;
  return { phase: done ? "finished" : "live", h, a, minute: Math.floor(minute), outcome: h > a ? "1" : h === a ? "X" : "2" };
}

/* 状态由三件事推出来：是否屏蔽、是否审核通过、是否为同场同类型里最新的已通过报告 */
function groupKey(rep) { return rep.matchId + "|" + rep.type; }
function computeStatuses(overrides) {
  const eff = (rep) => Object.assign({ review: rep.review, blocked: rep.blocked }, (overrides || {})[rep.id]);
  const latest = {};
  db.reports.forEach((rep) => {
    const e = eff(rep);
    if (e.blocked || e.review !== "approved") return;
    const k = groupKey(rep);
    if (!latest[k] || rep.generatedAt > latest[k].generatedAt) latest[k] = rep;
  });
  const out = {};
  db.reports.forEach((rep) => {
    const e = eff(rep);
    if (e.blocked) out[rep.id] = "blocked";
    else if (e.review !== "approved") out[rep.id] = "pending";
    else out[rep.id] = latest[groupKey(rep)] === rep ? "showing" : "expired";
  });
  return out;
}
let ST = {};
function refreshStatuses() { ST = computeStatuses(); }

function hitOf(rep) {
  const ms = matchState(MATCH[rep.matchId]);
  if (ms.phase !== "finished") return null;
  return rep.pick === ms.outcome;
}

/* ---------- 报告内容与AI思考过程 ---------- */
function reportText(rep, m) {
  const bb = m.sport === "basketball";
  const names = [m.home + " 胜", "平局", m.away + " 胜"];
  const i = PICK_INDEX[rep.pick];

    : `· 主队近期主场进攻效率较高，场均射正 5.2 次；\n· 客队后防线有轮换，定位球防守存在隐患；\n· 平局概率 ${rep.conf[1]}%，需关注临场首发调整。`;
  return `【${TYPE_LABEL[rep.type]}预测】${m.home} vs ${m.away}（${m.league}）

综合双方近10场战绩、主客场表现、伤停与盘口变化，模型给出的倾向为：${names[i]}（置信 ${rep.conf[i]}%）。

${extra}

以上内容由 ${rep.model} 生成，仅供参考。`;
}
/* 执行步骤日志：只为运行测试生成并保存；fail 为 { step, text } 时在该步中断 */
function buildSteps(run, m, p, rep, fail) {
  const bb = m.sport === "basketball";
  const end = run.startedAt + run.duration;
  const steps = [
    `接收任务：比赛 ${m.id}（${m.home} vs ${m.away}，${m.league}，开赛 ${fmtDT(m.kickoff).slice(0, 16)}）`,
    `运行测试：提示词「${p.name}」V${run.promptVersion}，模型 ${run.model}`,
    `填充变量：{home_team}=${m.home}，{away_team}=${m.away}，{league}=${m.league}`,
    `拉取数据：近10场战绩、主客场${bb ? "攻防效率" : "进失球"}、伤停名单`,
    bb ? "分析：客队背靠背，主队轮换完整，主场胜率 68%" : "拉取盘口：初盘与即时盘变化，主队让球加深 0.25",
    rep ? (bb ? `推理：主胜 ${rep.conf[0]}% / 客胜 ${rep.conf[2]}%，倾向 ${rep.pick}`
              : `推理：主胜 ${rep.conf[0]}% / 平 ${rep.conf[1]}% / 客胜 ${rep.conf[2]}%，倾向 ${rep.pick}`) : "推理：计算胜负概率",
    "生成报告正文，校验格式与敏感词：通过",
    rep ? `完成：消耗 Token ${fmtNum(rep.tokens)}，报告 #${rep.id} 已进入待审核` : "",
  ];
  const kept = fail ? steps.slice(0, fail.step) : steps;
  const lines = kept.map((text, k) => ({ text, ok: true }));
  if (fail) lines.push({ text: `失败：${fail.text}`, ok: false });
  return lines.map((l, k) => Object.assign(l, { at: run.startedAt + Math.round((end - run.startedAt) * k / Math.max(1, lines.length - 1)) }));
}
function stepsHtml(steps) {
  return `<div class="think">${steps.map((s) => `<div${s.ok ? "" : ' style="color:#fca5a5"'}><span class="t">${fmtDT(s.at).slice(11)}</span>${esc(s.text)}</div>`).join("")}</div>`;
}

function chainHtml(module, list, highlightId) {
  const chain = enabledChain(module, list);
  const odds = effectiveOdds(chain);
  const shadowed = chain.findIndex((p, i) => i < chain.length - 1 && p.ratio >= 100);
  return `<div class="chain">
    <h4>${MODULES[module]} · 执行顺序</h4>
    <div class="desc">按优先排序依次掷随机数（0–100），低于运行比率则执行；否则进入下一个；末位必定执行。</div>
    ${chain.length ? chain.map((p, i) => `<div class="chain-row"${p.id === highlightId ? ' style="background:#fff;border-radius:4px"' : ""}>
      <span class="no">${i + 1}</span>
      <span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="muted">${i === chain.length - 1 ? "末位必执行" : "比率 " + p.ratio + "%"}</span>
      <span class="pbar"><i style="width:${odds[i] * 100}%"></i></span>
      <span class="pv">${pct0(odds[i])}</span>
    </div>`).join("") : `<div class="note bad">没有启用的提示词，该模块无法生成报告。</div>`}
    ${shadowed >= 0 ? `<div class="warnline">「${esc(chain[shadowed].name)}」比率为100%，排在它后面的提示词不会被执行。</div>` : ""}
  </div>`;
}
function promptsVisible() {
  return db.prompts.filter((p) => (!ui.pf.module || p.module === ui.pf.module)
      && (!ui.pf.status || (ui.pf.status === "on") === p.enabled))
    .sort((a, b) => a.module.localeCompare(b.module) * -1 || (b.enabled - a.enabled) || a.priority - b.priority);
}
function ratioCell(p) {
  if (!p.enabled) return `${p.ratio}%<div class="muted small">停用，不参与</div>`;
  const chain = enabledChain(p.module);
  const idx = chain.indexOf(p);
  const odds = effectiveOdds(chain)[idx];
  return `${p.ratio}%<div class="muted small">${idx === chain.length - 1 ? "末位必定执行，" : ""}实际约 ${pct0(odds)}</div>`;
}
function testCell(p) {
  const runs = db.testRuns.filter((r) => r.promptId === p.id);
  if (runs.length) {
    return runs.map((r) => {
      const sec = Math.max(0, Math.round((Date.now() - r.startedAt) / 1000));
      return `<div><span class="tag warn"><span class="dot-run"></span>进行中 <span data-elapsed="${r.id}">${sec}s</span></span>
        <div class="muted small">${r.operator === OPERATOR ? "我" : esc(r.operator)} 发起</div></div>`;
    }).join("");
  }
  const t = p.lastTest;
  if (!t) return `<span class="muted">—</span>`;
  const when = `<div class="muted small">${esc(t.operator)} · ${fmtDT(t.at).slice(5, 16)}</div>`;
  if (t.status === "failed") {
    return `<span class="tag bad">失败</span> <button class="btn link" data-act="test-fail" data-pid="${p.id}">查看日志</button>
      <div class="small" style="color:var(--bad);max-width:220px;white-space:normal;margin:4px auto 0">${esc(t.reason)}</div>${when}`;
  }
  return `<button class="btn link" data-act="test-report" data-rid="${t.reportId}">查看报告</button>${when}`;
}

function promptCheck(d) {
  if (!d.name.trim()) return "请填写提示词名称。";
  if (db.prompts.some((p) => p.id !== d.id && p.name.trim() === d.name.trim())) return "提示词名称已存在。";
  if (!d.content.trim()) return "请填写提示词内容。";
  const ratio = Number(d.ratio), pr = Number(d.priority);
  if (!Number.isInteger(ratio) || ratio < 1 || ratio > 100) return "运行比率需为 1–100 的整数。";
  if (!Number.isInteger(pr) || pr < 1) return "优先排序需为正整数，数字越小越先执行。";
  return "";
}
function draftList(d) {
  const temp = { id: d.id || "__new", module: d.module, name: d.name || "（新提示词）", ratio: Number(d.ratio) || 0, priority: Number(d.priority) || 0, enabled: d.id ? db.prompts.find((p) => p.id === d.id).enabled : false };
  return db.prompts.filter((p) => p.id !== d.id).concat(temp);
}
function refreshPromptPreview() {
  const d = ui.draft;
  const err = promptCheck(d);
  const hint = document.getElementById("p-hint");
  const btn = document.getElementById("p-save");
  let ok = "新增后为 V1，默认停用，可先运行测试再启用。";
  if (d.id) {
    const p = db.prompts.find((x) => x.id === d.id);
    const bump = p.name !== d.name.trim() || p.content !== d.content;
    ok = bump ? `名称或内容有改动，保存后生成新版本 V${p.version + 1}，之后生成的报告使用新版本。` : `当前 V${p.version}。只改比率或排序不会生成新版本。`;
  }
  if (hint) { hint.textContent = err || ok; hint.className = "hint " + (err ? "bad" : "ok"); }
  if (btn) btn.disabled = !!err;
  const box = document.getElementById("p-chain");
  if (box) box.innerHTML = chainHtml(d.module, draftList(d), d.id || "__new");
}

/* ---------- 运行测试 ---------- */
function testCheck(d) {
  if (myRun()) return { ok: false, msg: "你的测试正在运行，完成后才能再次运行。" };
  if (!d.promptId) return { ok: false, msg: "请选择提示词。" };
  if (!d.model) return { ok: false, msg: "请选择本地模型。" };
  const id = (d.matchId || "").trim();
  if (!id) return { ok: false, msg: "请输入比赛ID。" };
  const m = MATCH[id];
  if (!m) return { ok: false, msg: "未找到该比赛ID。" };
  if (m.sport !== d.module) return { ok: false, msg: `该比赛是${SPORT_LABEL[m.sport]}，与所选模块不符。` };
  const ms = matchState(m);
  if (ms.phase === "finished") return { ok: false, msg: "比赛已结束，不能运行测试。" };
  return { ok: true, m, msg: `${m.home} vs ${m.away}（${m.league}，${fmtDT(m.kickoff).slice(0, 16)}）· 将生成${ms.phase === "live" ? "赛中" : "赛前"}报告` };
}
function refreshTestHint() {
  const c = testCheck(ui.draft);
  const hint = document.getElementById("t-hint");
  if (hint) { hint.textContent = c.msg; hint.className = "hint " + (c.ok ? "ok" : "bad"); }
  const btn = document.getElementById("t-run");
  if (btn) btn.disabled = !c.ok;
}
function startTest() {
  const d = ui.draft;
  const c = testCheck(d);
  if (!c.ok) return refreshTestHint();
  const p = db.prompts.find((x) => x.id === d.promptId);
  db.testRuns.push({ id: "run-" + Date.now(), operator: OPERATOR, promptId: p.id, promptVersion: p.version, matchId: c.m.id,
    module: d.module, model: d.model, startedAt: Date.now(), duration: TEST_DURATION });
  save();
  ui.modal = null; renderModal(); render();
  toast("已开始运行（异步），完成后报告会进入「AI预测报告管理」，状态为待审核，请到该页面查看。", 5000);
}
function finishTest(run) {
  const m = MATCH[run.matchId];
  const p = db.prompts.find((x) => x.id === run.promptId);
  run.promptVersion = run.promptVersion || p.version;
  const at = run.startedAt + run.duration;
  db.testRuns = db.testRuns.filter((r) => r.id !== run.id);
  const mine = run.operator === OPERATOR;
  if (Math.random() < TEST_FAIL_RATE) {
    const fail = FAIL_REASONS[Math.floor(Math.random() * FAIL_REASONS.length)];
    p.lastTest = { status: "failed", at, operator: run.operator, reason: fail.text, matchId: m.id, steps: buildSteps(run, m, p, null, fail) };
    p.log.unshift({ at, actor: run.operator, text: `运行测试失败：比赛 ${m.id}。原因：${fail.text}` });
    save(); render();
    if (mine) toast(`测试失败：${fail.text}`, 5000);
    return;
  }
  const type = matchState(m).phase === "live" ? "live" : "pre";
  const rep = makeReport(Math.random, m, type, at, { test: true, promptId: p.id, promptVersion: run.promptVersion, source: "local", model: run.model });
  rep.id = String(Math.max(...db.reports.map((x) => Number(x.id))) + 1);
  rep.steps = buildSteps(run, m, p, rep, null);
  rep.log = [{ at, actor: run.operator, text: `提示词管理中运行测试（提示词「${p.name}」V${run.promptVersion}），生成后进入待审核。` }];
  db.reports.push(rep);
  p.lastTest = { status: "done", reportId: rep.id, at, operator: run.operator };
  p.log.unshift({ at, actor: run.operator, text: `运行测试完成：比赛 ${m.id}，生成报告 #${rep.id}（待审核）。` });
  save();
  render(); renderDrawer();
  if (ui.modal && ui.modal.kind === "test-run") renderModal();
  if (mine) toast(`测试完成：报告 #${rep.id} 已生成，状态待审核。`, 4000);
}
function tick() {
  if (!db.testRuns.length) return;
  const due = db.testRuns.filter((r) => Date.now() >= r.startedAt + r.duration);
  if (due.length) { due.forEach(finishTest); return; }
  db.testRuns.forEach((r) => {
    document.querySelectorAll(`[data-elapsed="${r.id}"]`).forEach((el) => { el.textContent = Math.round((Date.now() - r.startedAt) / 1000) + "s"; });
  });
}

}

function applyReport(rep, change, logText, verb) {
  const lines = impact(rep, change).filter((l) => !l.includes("（本报告）"));
  Object.assign(rep, change);
  rep.log.unshift({ at: Date.now(), actor: OPERATOR, text: logText });
  save();
  ui.modal = null;
  render(); renderModal(); renderDrawer();
  toast(`${verb}，当前状态：${STATUS[ST[rep.id]].label}${lines.length ? "；" + lines.join("；") : ""}`);
}

function savePrompt() {
  const d = ui.draft;
  if (promptCheck(d)) return refreshPromptPreview();
  const at = Date.now();
  if (d.id) {
    const p = db.prompts.find((x) => x.id === d.id);
    const changes = [];
    if (p.name !== d.name.trim()) changes.push("名称");
    if (p.content !== d.content) changes.push("内容");
    if (p.ratio !== Number(d.ratio)) changes.push(`运行比率 ${p.ratio}%→${d.ratio}%`);
    if (p.priority !== Number(d.priority)) changes.push(`优先排序 ${p.priority}→${d.priority}`);
    const bump = p.name !== d.name.trim() || p.content !== d.content;
    Object.assign(p, { name: d.name.trim(), content: d.content, ratio: Number(d.ratio), priority: Number(d.priority), operator: OPERATOR, updatedAt: at });
    if (bump) {
      p.version += 1;
      p.versions.push({ v: p.version, name: p.name, content: p.content, at, operator: OPERATOR });
    }
    p.log.unshift({ at, actor: OPERATOR, text: changes.length ? `编辑：${changes.join("、")}${bump ? `，版本升级为 V${p.version}` : ""}。` : "保存（无改动）。" });
    toast(bump ? `已保存，生成新版本 V${p.version}` : "已保存");
  } else {
    const id = "PR" + String(Math.max(...db.prompts.map((p) => Number(p.id.slice(2)))) + 1).padStart(3, "0");
    db.prompts.push({ id, module: d.module, name: d.name.trim(), content: d.content, ratio: Number(d.ratio), priority: Number(d.priority),
      enabled: false, operator: OPERATOR, updatedAt: at, lastTest: null, version: 1,
      versions: [{ v: 1, name: d.name.trim(), content: d.content, at, operator: OPERATOR }],
      log: [{ at, actor: OPERATOR, text: "新增提示词（V1），默认停用。" }] });
    toast("已新增，默认停用。可点击「运行测试」验证效果后再启用。", 4000);
  }
  save(); ui.modal = null; renderModal(); render();
}

document.addEventListener("click", (e) => {

  if (act === "rules") { ui.modal = { kind: "rules" }; renderModal(); return; }

  if (act === "do-toggle") {
    const p = db.prompts.find((x) => x.id === ui.modal.pid);
    if (p.enabled && onlyEnabled(p)) { toast("每个模块至少保留一个启用的提示词"); return; }
    p.enabled = !p.enabled; p.operator = OPERATOR; p.updatedAt = Date.now();
    p.log.unshift({ at: p.updatedAt, actor: OPERATOR, text: p.enabled ? "启用。" : "停用。" });
    save(); ui.modal = null; renderModal(); render(); toast(p.enabled ? "已启用" : "已停用"); return;
  }
  if (act === "test-open") {
    const p = el.dataset.pid ? db.prompts.find((x) => x.id === el.dataset.pid) : enabledChain(ui.pf.module || "football")[0];
    ui.draft = { module: p.module, promptId: p.id, matchId: "", model: MODELS.local[0] };
    ui.modal = { kind: "test-run" }; renderModal(); return;
  }
  if (act === "test-start") return startTest();
  if (act === "test-report") { ui.modal = { kind: "test-report", rid: el.dataset.rid }; renderModal(); return; }
  if (act === "test-fail") { ui.modal = { kind: "test-fail", pid: el.dataset.pid }; renderModal(); return; }
  if (act === "goto-report") {
    ui.modal = null; renderModal();
    ui.view = "reports"; location.hash = "";
    ui.form = Object.assign(blankForm(), { q: el.dataset.rid }); ui.applied = Object.assign({}, ui.form); ui.tab = "all"; ui.pageNo = 1;
    render(); ui.openId = el.dataset.rid; renderDrawer(); return;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.f) {
    ui.form[t.dataset.f] = t.value;
    if (t.dataset.f === "from" || t.dataset.f === "to") {
      ui.form.quick = "";
      document.querySelectorAll(".quick button").forEach((b) => b.classList.remove("on"));
    }
  }
  if (t.dataset.pd) { ui.draft[t.dataset.pd] = t.value; refreshPromptPreview(); }
  if (t.dataset.td === "matchId") { ui.draft.matchId = t.value; refreshTestHint(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  const k = t.dataset.actChange;
  if (k === "size") { ui.size = Number(t.value); ui.pageNo = 1; render(); }
  if (k === "goto") { const n = parseInt(t.value, 10); if (n > 0) { ui.pageNo = n; render(); } }
  if (t.dataset.pf) { ui.pf[t.dataset.pf] = t.value; render(); }
  if (t.dataset.td === "module") {
    ui.draft.module = t.value;
    const first = db.prompts.filter((p) => p.module === t.value).sort((a, b) => b.enabled - a.enabled || a.priority - b.priority)[0];
    ui.draft.promptId = first ? first.id : "";
    ui.draft.matchId = "";
    renderModal();
  }
  if (t.dataset.td === "promptId" || t.dataset.td === "model") { ui.draft[t.dataset.td] = t.value; refreshTestHint(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (ui.modal) { ui.modal = null; renderModal(); } else if (ui.openId) { ui.openId = null; renderDrawer(); } }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.f === "q") { ui.applied = Object.assign({}, ui.form); ui.pageNo = 1; render(); }
});
window.addEventListener("hashchange", () => {
  const v = location.hash === "#prompts" ? "prompts" : "reports";
  if (v !== ui.view) { ui.view = v; render(); }
});

load();
rebuildMatchMap();
save();
render();
setInterval(tick, 1000);
</script>
</body>
</html>
